<style>
/* 單一視覺世界：遊戲本身的晴空色票，不跟隨深淺色主題 */
:root {
	--sky: #8fcdef;
	--sky-deep: #5fb2e6;
	--ink: #23466e;
	--paper: #fbf6e9;
	--sun: #f6c445;
	--grass: #86c46b;
	color-scheme: light;
}
html, body { height: 100%; margin: 0; background: var(--sky); overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* 遊戲畫面固定 16:9 置中；比較寬或比較高的螢幕，四周用目前場景的模糊氛圍圖補滿，不出現黑邊 */
#canvas { display: block; position: fixed; left: 0; top: 0; outline: none; background: var(--sky); }
.amb { position: fixed; inset: -40px; background: var(--sky) center / cover no-repeat; filter: blur(14px) saturate(1.1) brightness(0.92); transition: opacity 1.2s ease; }
#amb-b { opacity: 0; }
#amb-shade { position: fixed; inset: 0; pointer-events: none; }
#status {
	position: fixed; inset: 0; z-index: 5;
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.4vh, 18px);
	background: var(--sky) url(amb_title.jpg) center / cover no-repeat;
	color: var(--ink); font: 600 16px/1.5 system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
	text-align: center; overflow: hidden;
}
#status::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(255,255,255,.18), rgba(255,255,255,.05) 55%, rgba(35,70,110,.12)); }
#status > * { position: relative; }
#logo { width: min(560px, 74vw, 62vh * 1.75); height: auto; filter: drop-shadow(0 6px 10px rgba(35,70,110,.25)); animation: float 3.2s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
/* 道路：機車依下載進度往右騎 */
#track { --p: 0; --sw: clamp(84px, 13vw, 132px); position: relative; width: min(620px, 86vw); height: calc(var(--sw) * 1.2); }
#road { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; border-radius: 10px; background: #8d9196;
	box-shadow: inset 0 3px 0 #e8e4da, inset 0 -3px 0 #e8e4da, 0 6px 14px rgba(35,70,110,.18); overflow: hidden; }
#road::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px;
	background: repeating-linear-gradient(90deg, #f6f4ee 0 22px, transparent 22px 40px); animation: dash .6s linear infinite; }
@keyframes dash { to { background-position: -40px 0; } }
#done { position: absolute; left: 0; bottom: 0; height: 26%; width: calc(var(--p) * 1%); border-radius: 10px 0 0 10px;
	background: linear-gradient(90deg, rgba(246,196,69,.0), rgba(246,196,69,.55)); transition: width .25s; }
/* 終點旗：棋盤格小旗子 */
#flag { position: absolute; right: 6px; bottom: 26%; width: 4px; height: calc(var(--sw) * .55); background: #5a4a3a; border-radius: 2px; }
#flag::after { content: ""; position: absolute; left: 4px; top: 0; width: calc(var(--sw) * .3); height: calc(var(--sw) * .2);
	background: conic-gradient(#23466e 25%, #fff 0 50%, #23466e 0 75%, #fff 0) 0 0 / calc(var(--sw) * .1) calc(var(--sw) * .1);
	border: 1px solid #23466e; border-radius: 0 3px 3px 0; }
#scooter { position: absolute; bottom: 9%; width: var(--sw); left: calc((100% - var(--sw)) * var(--p) / 100); transition: left .25s linear; }
#scooter .body { display: block; width: 100%; height: auto; animation: bob .35s ease-in-out infinite alternate; }
#scooter .wheel { position: absolute; animation: spin .45s linear infinite; }
#scooter .wf { left: calc(187 / 246 * 100%); top: calc(221 / 279 * 100%); width: calc(46 / 246 * 100%); }
#scooter .wr { left: calc(23 / 246 * 100%); top: calc(224 / 279 * 100%); width: calc(42 / 246 * 100%); }
@keyframes bob { to { transform: translateY(-2px); } }
@keyframes spin { to { transform: rotate(360deg); } }
#pct { font: 800 clamp(18px, 3.2vh, 24px)/1 system-ui, "PingFang TC", "Noto Sans TC", sans-serif; color: #fff;
	text-shadow: 0 2px 0 rgba(35,70,110,.55), 0 0 8px rgba(35,70,110,.4); letter-spacing: .04em; }
#msg { min-height: 1.5em; font-size: 14px; max-width: 30em; color: var(--ink);
	background: rgba(255,250,240,.85); padding: 4px 14px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { #logo, #road::before, #scooter .body, #scooter .wheel { animation: none; } }
#notice { display: none; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 12px 16px; max-width: 30em; white-space: pre-line; }
#rotate-hint {
	display: none; position: fixed; inset: 0; z-index: 20; background: var(--sky); color: var(--ink);
	font: 700 22px/1.7 system-ui, "PingFang TC", "Noto Sans TC", sans-serif; text-align: center;
	align-items: center; justify-content: center; flex-direction: column; gap: 8px;
	padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#rotate-hint .phone { width: 46px; height: 78px; border: 5px solid var(--ink); border-radius: 10px; animation: turn 2s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate-hint { display: flex; } }
#rotate-hint.dismissed { display: none !important; }
#rotate-hint button {
	margin-top: 14px; padding: 12px 28px; font: 700 18px/1.2 system-ui, "PingFang TC", "Noto Sans TC", sans-serif;
	color: var(--ink); background: var(--sun); border: 3px solid var(--ink); border-radius: 12px; cursor: pointer;
}
#rotate-hint button:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
#rotate-hint .small { font-size: 14px; font-weight: 600; opacity: 0.8; }
#sound-hint {
	display: none; position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 15;
	padding: 8px 16px; border-radius: 999px; background: rgba(251, 246, 233, 0.92); border: 2px solid var(--ink); color: var(--ink);
	font: 700 15px/1.3 system-ui, "PingFang TC", "Noto Sans TC", sans-serif; pointer-events: none; white-space: nowrap;
}
#sound-hint.show { display: block; }
</style>

<script>
// 聲音解鎖：瀏覽器（特別是 iPhone）只允許在「使用者點擊的當下」啟動聲音。
// Godot 會延到下一格才恢復音訊，iOS 不認，所以這裡記下遊戲建立的 AudioContext，在點擊當下直接恢復。
(function () {
	const AC = window.AudioContext || window.webkitAudioContext;
	if (!AC) { return; }
	const ctxs = [];
	function Wrapped(...args) { const c = new AC(...args); ctxs.push(c); watch(c); return c; }
	Wrapped.prototype = AC.prototype;
	window.AudioContext = Wrapped;
	if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
	// iOS 17+：讓網頁聲音不受側邊靜音鍵影響（像影片一樣播放）
	try { if (navigator.audioSession) { navigator.audioSession.type = 'playback'; } } catch (e) { /* 不支援就略過 */ }
	const hint = () => document.getElementById('sound-hint');
	function update() {
		const blocked = ctxs.some(c => c.state !== 'running') || (window.rtMusic && window.rtMusic.blocked());
		const need = blocked && !document.getElementById('status');
		const h = hint();
		if (h) { h.classList.toggle('show', need); }
	}
	function watch(c) { c.addEventListener('statechange', update); setTimeout(update, 0); }
	function unlock() {
		if (window.rtMusic) { window.rtMusic.unlock(); }
		for (const c of ctxs) {
			if (c.state !== 'running') {
				c.resume().then(update, () => {});
				// 在點擊當下播放一段無聲音訊，iOS 才會真正打開聲音
				try {
					const b = c.createBuffer(1, 1, 22050);
					const src = c.createBufferSource();
					src.buffer = b; src.connect(c.destination); src.start(0);
				} catch (e) { /* 略過 */ }
			}
		}
	}
	for (const ev of ['pointerdown', 'touchstart', 'touchend', 'mousedown', 'keydown', 'click']) {
		window.addEventListener(ev, unlock, { capture: true, passive: true });
	}
	setInterval(update, 1000);

	// 背景音樂：網頁版用頁面自己的 <audio> 播放（不佔用遊戲主執行緒、不會因掉格而斷音）
	// 遊戲透過 JavaScriptBridge 呼叫 rtMusic.play('title' | 'ride')、stop()、setVolume(0~1)
	window.rtMusic = (function () {
		const files = { title: 'music_title.mp3', ride: 'music_ride.mp3' };
		const BASE = 0.8;
		const els = {};
		let want = null, vol = 1, blockedFlag = false;
		function el(name) {
			if (!els[name]) {
				const a = new Audio(files[name]);
				a.loop = true; a.preload = 'auto'; a.volume = 0; a._target = 0;
				els[name] = a;
			}
			return els[name];
		}
		// 每 50ms 把音量往目標靠近，做淡入淡出
		setInterval(() => {
			for (const k in els) {
				const a = els[k];
				const t = a._target * BASE * vol;
				const step = 0.05;
				if (Math.abs(a.volume - t) <= step) { a.volume = Math.max(0, Math.min(1, t)); }
				else { a.volume = Math.max(0, Math.min(1, a.volume + (t > a.volume ? step : -step))); }
				if (a._target === 0 && a.volume === 0 && !a.paused) { a.pause(); }
			}
		}, 50);
		function start(name) {
			const a = el(name);
			a._target = 1;
			const p = a.play();
			if (p && p.then) {
				p.then(() => { blockedFlag = false; update(); }, () => { blockedFlag = true; update(); });
			}
		}
		return {
			play(name) {
				if (!files[name]) { return; }
				want = name;
				for (const k in els) { if (k !== name) { els[k]._target = 0; } }
				start(name);
			},
			stop() { want = null; for (const k in els) { els[k]._target = 0; } },
			setVolume(v) { vol = Math.max(0, Math.min(1, Number(v) || 0)); },
			unlock() { if (want && el(want).paused) { start(want); } },
			blocked() { return blockedFlag && want !== null; },
			state() { return Object.keys(els).map(k => `${k}:${els[k].paused ? 'paused' : 'playing'} t=${els[k].currentTime.toFixed(1)} v=${els[k].volume.toFixed(2)}`).join(' | ') + ` want=${want}`; },
		};
	}());
}());
</script>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14662064,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
// 自己控制畫布大小（16:9 置中），Godot 依畫布像素尺寸算畫面
GODOT_CONFIG.canvasResizePolicy = 0;
(function () {
	const canvas = document.getElementById('canvas');
	const shade = document.getElementById('amb-shade');
	function fit() {
		const vw = window.innerWidth, vh = window.innerHeight;
		let w = vw, h = vw * 9 / 16;
		if (h > vh) { h = vh; w = vh * 16 / 9; }
		w = Math.round(w); h = Math.round(h);
		const x = Math.round((vw - w) / 2), y = Math.round((vh - h) / 2);
		const dpr = Math.min(window.devicePixelRatio || 1, 2);
		canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
		canvas.style.left = x + 'px'; canvas.style.top = y + 'px';
		canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
		// 靠近遊戲畫面的地方淡淡壓暗，讓畫面邊界自然
		shade.style.background = x > 0
			? `linear-gradient(90deg, rgba(20,40,60,.0) 0, rgba(20,40,60,.18) ${x}px, transparent ${x}px, transparent ${x + w}px, rgba(20,40,60,.18) ${x + w}px, rgba(20,40,60,0) 100%)`
			: 'none';
	}
	fit();
	window.addEventListener('resize', fit);
	window.addEventListener('orientationchange', () => setTimeout(fit, 200));
	// 由遊戲呼叫：切換兩側的氛圍圖（title / town / fields / mountain / grassland）
	let cur = 'title', front = 'amb-a';
	window.rtAmbient = function (key) {
		if (!key || key === cur) { return; }
		cur = key;
		const back = front === 'amb-a' ? 'amb-b' : 'amb-a';
		const nb = document.getElementById(back), nf = document.getElementById(front);
		nb.style.backgroundImage = `url(amb_${key}.jpg)`;
		nb.style.opacity = '1'; nf.style.opacity = '0';
		front = back;
	};
}());
const engine = new Engine(GODOT_CONFIG);
(function () {
	const status = document.getElementById('status');
	const track = document.getElementById('track');
	const pct = document.getElementById('pct');
	const msg = document.getElementById('msg');
	const notice = document.getElementById('notice');
	function fail(err) {
		console.error(err);
		notice.style.display = 'block';
		notice.textContent = '遊戲無法啟動：\n' + (err && err.message ? err.message : String(err));
		track.style.display = 'none'; pct.style.display = 'none';
		msg.textContent = '';
	}
	const missing = Engine.getMissingFeatures({ threads: false });
	if (missing.length) {
		fail(new Error('瀏覽器缺少執行遊戲需要的功能：\n' + missing.join('\n')));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const p = Math.min(100, current / total * 100);
				track.style.setProperty('--p', p.toFixed(1));
				pct.textContent = Math.floor(p) + '%';
				if (current >= total) { pct.textContent = '100%'; msg.textContent = '抵達！準備出發…'; }
			}
		},
	}).then(() => { status.remove(); document.getElementById('canvas').focus(); }, fail);
}());
</script>
